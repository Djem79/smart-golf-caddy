# ios/project.yml — единственный источник правды для .xcodeproj.
# После правок: cd ios && xcodegen
#
# ВАЖНО (#14464): FirebaseFirestore линкуется ТОЛЬКО в app-таргет.
# Не добавлять Firebase-продукты в тест-таргет: precompiled Firestore не
# линкуется в два таргета, а обход через сборку из исходников
# (FIREBASE_SOURCE_FIRESTORE=1) создаёт ВТОРУЮ копию FirebaseCore в
# отдельном framework — Firestore видит пустой реестр приложений и роняет
# процесс (FIRIllegalStateException) при первом же Firestore.firestore().
# Тесты app-hosted: классы Firebase доступны из рантайма хоста
# (NSClassFromString), линковка им не нужна.
name: SmartGolfCaddy
options:
  bundleIdPrefix: com.dzhambulat
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  SmartGolfCaddy:
    type: application
    platform: iOS
    sources: [SmartGolfCaddy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzhambulat.smartgolfcaddy
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEV_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only (1): UI свёрстан под 390 pt; без этого xcodegen даёт
        # "1,2" (iPhone+iPad), и App Store Connect требует iPad-скриншоты.
        TARGETED_DEVICE_FAMILY: "1"
        # Sign in with Apple — включено 02.09.2026 после активации платного
        # аккаунта (Individual). DEV_TEAM в Local.xcconfig должен быть
        # Team ID платной команды, иначе провижининг на устройство падает.
        CODE_SIGN_ENTITLEMENTS: SmartGolfCaddy/SmartGolfCaddy.entitlements
    info:
      path: SmartGolfCaddy/Info.plist
      properties:
        CFBundleDisplayName: Smart Golf Caddy
        # Версия релиза. CFBundleVersion наращивать на КАЖДУЮ загрузку в
        # App Store Connect (одинаковый build number отклоняется); у
        # watch-таргета версия обязана совпадать с iOS (требование Apple
        # для companion-приложений) — см. блок SmartGolfCaddyWatch ниже.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: ["PlayfairDisplay-Regular.ttf", "PlayfairDisplay-Medium.ttf", "PlayfairDisplay-SemiBold.ttf", "PlayfairDisplay-Bold.ttf"]
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
          - CFBundleURLSchemes: ["smartgolfcaddy"]
        NSLocationWhenInUseUsageDescription: "Геолокация нужна, чтобы найти гольф-поля рядом с вами."
        GooglePlacesAPIKey: "$(GOOGLE_PLACES_IOS_KEY)"
        # Только HTTPS/стандартное шифрование ОС — экспортная декларация не
        # нужна; без ключа App Store Connect спрашивает это при КАЖДОЙ
        # загрузке сборки (docs/appstore/submission-package.md).
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: SmartGolfCaddyWatch
        embed: true
  SmartGolfCaddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmartGolfCaddyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SmartGolfCaddy
  # Watch companion (Phase 3c). Никакого Firebase/GoogleSignIn — эти SDK не
  # собираются под watchOS. Sources ссылаются на общий Foundation-only
  # домен (Models/) и чисто-SwiftUI дизайн-токены (DesignSystem/) —
  # подключение по пути, не копия.
  SmartGolfCaddyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - SmartGolfCaddyWatch
      - path: SmartGolfCaddy/Models          # общий домен, Foundation-only
      - path: SmartGolfCaddy/DesignSystem    # цвета/шрифты/токены
      - path: SmartGolfCaddy/Resources/Fonts # Playfair Display — ресурс, не код iOS-таргета
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dzhambulat.smartgolfcaddy.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEV_TEAM)
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    info:
      path: SmartGolfCaddyWatch/Info.plist
      properties:
        CFBundleDisplayName: Golf Caddy
        # Обязано совпадать с версией iOS-приложения (companion), иначе
        # App Store Connect отклоняет сборку.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dzhambulat.smartgolfcaddy
        NSLocationWhenInUseUsageDescription: "Геолокация нужна, чтобы показывать дистанцию до грина и мерить длину ударов."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: ["PlayfairDisplay-Regular.ttf", "PlayfairDisplay-Medium.ttf", "PlayfairDisplay-SemiBold.ttf", "PlayfairDisplay-Bold.ttf"]
  SmartGolfCaddyWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [SmartGolfCaddyWatchTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SmartGolfCaddyWatch
schemes:
  SmartGolfCaddy:
    build:
      targets:
        SmartGolfCaddy: all
        SmartGolfCaddyTests: [test]
    test:
      targets: [SmartGolfCaddyTests]
  SmartGolfCaddyWatch:
    build:
      targets:
        SmartGolfCaddyWatch: all
        SmartGolfCaddyWatchTests: [test]
    test:
      targets: [SmartGolfCaddyWatchTests]
